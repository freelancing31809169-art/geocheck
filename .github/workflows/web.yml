name: Deploy geocheck.ing

on:
  push:
    branches: [main]
    paths:
      - "scripts/geocheck.sh"
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the launcher before shipping it
        run: |
          shellcheck scripts/geocheck.sh
          sh -n scripts/geocheck.sh
          dash -n scripts/geocheck.sh

      - name: Embed the launcher into the Worker
        run: |
          ./scripts/build-worker.sh
          node --check web/dist/worker.js

      - name: What we are about to serve must match the repository byte for byte
        run: |
          set -euo pipefail
          cat > /tmp/roundtrip.mjs <<'EOF'
          const mod = await import(process.env.WORKER);
          const r = await mod.default.fetch(new Request("https://geocheck.ing/geocheck.sh"));
          process.stdout.write(await r.text());
          EOF
          WORKER="$PWD/web/dist/worker.js" node /tmp/roundtrip.mjs > /tmp/served.sh
          diff scripts/geocheck.sh /tmp/served.sh

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web

      - name: Verify the live endpoint serves the same script
        run: |
          set -euo pipefail
          sleep 10
          curl -fsSL --retry 5 --retry-delay 3 https://geocheck.ing > /tmp/live.sh
          diff scripts/geocheck.sh /tmp/live.sh
          echo "geocheck.ing is serving the current launcher"
