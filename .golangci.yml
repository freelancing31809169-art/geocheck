version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - revive
    - unconvert
    - prealloc

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      ignore-rules:
        - colour

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, prealloc]

formatters:
  enable:
    - gofmt
